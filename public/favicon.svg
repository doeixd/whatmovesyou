<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="A dot on a track">
  <!-- The band display, reduced to a mark: a track, a centre tick for your own
       average, and a dot sitting off-centre. It means the same thing the
       results page means, and it isn't a brain. -->
  <style>
    .ground { fill: #fbfaf8 }
    .rule   { stroke: #cfccc5 }
    .tick   { stroke: #767981 }
    .dot    { fill: #2d5b4e }
    @media (prefers-color-scheme: dark) {
      .ground { fill: #131419 }
      .rule   { stroke: #3c404a }
      .tick   { stroke: #85888f }
      .dot    { fill: #8cc0ae }
    }
  </style>
  <rect class="ground" width="32" height="32" rx="7"/>
  <line class="rule" x1="5" y1="16" x2="27" y2="16" stroke-width="1.5" stroke-linecap="round"/>
  <line class="tick" x1="16" y1="11" x2="16" y2="21" stroke-width="1.5" stroke-linecap="round"/>
  <circle class="dot" cx="22" cy="16" r="4"/>
</svg>
